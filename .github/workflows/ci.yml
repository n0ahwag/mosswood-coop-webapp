name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma-Schema prüfen
        run: npx prisma validate
        working-directory: server
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - name: Engine-Tests
        run: npm test
      - name: Client typprüfen und bauen
        run: npm run build
